name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write          # lets the job prove to Google that it runs in Europe-Elects

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Not secret: these only name the Google identity. Access is limited to Europe-Elects Actions.
  GCP_PROVIDER: projects/659866385408/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_SERVICE_ACCOUNT: ee-sheets-reader@project-6c08a079-4a01-46eb-aaf.iam.gserviceaccount.com
  GID: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false

      - name: Download sheet as CSV
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
          SHEET_ID: ${{ secrets.PARTY_DB_SHEET_ID }}
        run: |
          test -n "$SHEET_ID" || { echo "Secret PARTY_DB_SHEET_ID is missing"; exit 1; }
          mkdir -p _site/data
          python3 scripts/sheet_csv.py "$SHEET_ID" "$GID" raw.csv

      - name: Drop ignored columns and validate
        run: |
          python3 - <<'PY'
          import csv, sys
          STOP = "Documented Links (Exl. Affiliation, Excl. Within Own ISO Country) with EP Group"
          IGNORE = {STOP, "Orientation", "CEEGLA", "LIBSEEN", "Other International Affiliations",
                    "Date Enter", "Date Exit", "Note", "Latest",
                    "Europe Elects European Parliament Seat Projection Assignment"}
          with open("raw.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          head = [h.strip() for h in rows[0]]
          if "Europe Elects Entity ID" not in head:
              sys.exit("Unexpected sheet layout: header row not found")
          # European countries and territories only (the sheet also holds other continents, e.g. Africa).
          # Same list as the country pages; add a code here if a European country is missing.
          EUROPE = set("""AL AD AM AT AZ BY BE BA BG HR CY CZ DK EE FO FI FR GE DE GI GR GL GG HU IS IE IM IT JE XK LV LI
                          LT LU MT MD MC ME NL MK NO PL PT RO RU SM RS SK SI ES SE CH TR UA GB VA AX EU KZ SJ""".split())
          iso = head.index("ISO-2")
          cut = head.index(STOP) if STOP in head else len(head)
          keep = [i for i, h in enumerate(head) if i < cut and h and h not in IGNORE]
          out = [[head[i] for i in keep]]
          for r in rows[1:]:
              r = r + [""] * (len(head) - len(r))
              if not any(c.strip() for c in r) or r[iso].strip().upper() not in EUROPE:
                  continue
              out.append([r[i] for i in keep])
          with open("_site/data/parties.csv", "w", newline="", encoding="utf-8") as f:
              csv.writer(f).writerows(out)
          print(f"{len(out)-1} rows, {len(keep)} columns kept; countries: {' '.join(sorted({r[iso] for r in rows[1:] if len(r) > iso and r[iso].strip().upper() in EUROPE}))}")
          PY

      - name: Assemble site
        run: cp index.html style.css app.js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
